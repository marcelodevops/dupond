name: Dupond Continuous Integration

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build, Lint & Automated Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      GIT_AUTHOR_NAME: Dupond Test
      GIT_AUTHOR_EMAIL: test@example.com
      GIT_COMMITTER_NAME: Dupond Test
      GIT_COMMITTER_EMAIL: test@example.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npm run lint

      - name: Client build (Vite)
        run: npm run build

      - name: Configure Git identity for test commits
        run: |
          git config --global user.name "Dupond Test"
          git config --global user.email "test@example.com"
          git config --global commit.gpgsign false

      - name: Pre-pull sandbox container image
        run: npm run prepare:sandbox

      - name: Run automated test suite (vitest)
        run: npm test

      - name: Check release version metadata and policy
        run: npm run release:check
